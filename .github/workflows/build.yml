name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 1. توليد ملفات الأندرويد
      - name: Create Android files
        run: flutter create --project-name transparency_go . --platforms android

      # 2. تحديث إصدار Kotlin (الحل الجذري للمشكلة)
      - name: Update Kotlin Version
        run: |
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' android/build.gradle || true

      # 3. جلب الاعتماديات
      - name: Install dependencies
        run: flutter pub get

      # 4. البناء (مع تقسيم الملفات إلى 3 كما طلبت)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # 5. رفع الملفات الثلاثة
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Flutter Build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
