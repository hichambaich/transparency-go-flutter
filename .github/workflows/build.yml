name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android files
        run: flutter create --project-name transparency_go . --platforms android

      # تحديث الإصدارات لتتوافق مع Flutter 3.24.0
      - name: Update Gradle, AGP, and Kotlin Versions
        run: |
          # تحديث إصدار Kotlin إلى 2.0.10
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.10"/' android/build.gradle
          
          # تحديث إصدار Android Gradle Plugin إلى 8.5.0
          sed -i 's/com.android.application" version .*/com.android.application" version "8.5.0"/' android/settings.gradle
          
          # تحديث إصدار Gradle إلى 8.7
          sed -i 's/distributionUrl=.*/distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # تحديث SDKs
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Clean Build
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Flutter Build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
