name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android files
        run: flutter create --project-name transparency_go . --platforms android

      # --- الحل الجذري: كتابة ملفات Gradle يدوياً لضمان التوافق التام ---
      - name: Force correct Gradle, AGP, and Kotlin versions
        run: |
          # 1. تحديث إصدار Gradle (استخدام bin.zip بدلاً من all.zip لتجنب مشاكل الحجم)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. تحديث إصدار AGP و Kotlin في ملف settings.gradle
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.10" apply false
          }
          include ":app"
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Clean Build
        run: flutter clean

      # --- إضافة --stacktrace للحصول على تفاصيل أكثر إذا فشل البناء ---
      - name: Build APK
        run: flutter build apk --release --split-per-abi --stacktrace

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Flutter Build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
